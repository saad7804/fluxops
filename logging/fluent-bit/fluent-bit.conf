[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    DB                /fluent-bit/state/flb.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     fluxops-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
