apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluxops
  template:
    metadata:
      labels:
        app: fluxops
    spec:
      containers:
        - name: fluxops
          image: yourdockerhubusername/fluxops:v1
          ports:
            - containerPort: 80
