---
- name: Configure FluxOps EC2 Server
  hosts: fluxops
  become: true

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Enable and start Apache2
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Check Apache2 service
      ansible.builtin.command: systemctl is-active apache2
      register: apache_status
      changed_when: false

    - name: Display Apache2 status
      ansible.builtin.debug:
        msg: "Apache2 status: {{ apache_status.stdout }}"
